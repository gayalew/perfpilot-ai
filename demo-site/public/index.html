<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trailhead Coffee Roasters</title>
  <meta name="description" content="Small-batch coffee roasted in Bahir Dar.">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/vendor.js"></script>
  <script src="/js/analytics.js"></script>
</head>
<body>
  <header class="top">
    <strong>Trailhead Coffee</strong>
    <nav><a href="#menu">Menu</a> <a href="#gallery">Gallery</a> <a href="#visit">Visit</a></nav>
  </header>

  <section class="hero">
    <img src="/img/hero.png" alt="Pour-over coffee on a wooden table">
    <div class="hero-text">
      <h1>Coffee worth the climb</h1>
      <p>Small-batch beans, roasted every morning.</p>
    </div>
  </section>

  <section id="menu" class="menu">
    <h2>Menu</h2>
    <ul>
      <li>Espresso <span>40 ETB</span></li>
      <li>Macchiato <span>55 ETB</span></li>
      <li>Pour-over <span>70 ETB</span></li>
      <li>Cold brew <span>80 ETB</span></li>
    </ul>
  </section>

  <section id="gallery" class="gallery">
    <h2>Gallery</h2>
    <div class="grid">
      <img src="/img/g1.png" alt="Fresh roasted beans">
      <img src="/img/g2.png" alt="Barista pouring latte art">
      <img src="/img/g3.png" alt="Cafe interior">
      <img src="/img/g4.png" alt="Coffee cherries on the branch">
      <img src="/img/g5.png" alt="Cup and saucer">
      <img src="/img/g6.png" alt="Grinder close-up">
    </div>
  </section>

  <section id="visit" class="visit">
    <h2>Visit</h2>
    <p>Kebele 11, Bahir Dar. Open daily 7:00 to 20:00.</p>
  </section>

  <footer>© Trailhead Coffee Roasters</footer>
  <script src="/js/app.js"></script>
</body>
</html>
